<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaamulPro — Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#2A3442;
    --charcoal-800:#212a36;
    --charcoal-900:#171e27;
    --teal:#0E8B8B;
    --teal-dark:#0B6F6F;
    --teal-light:#E3F3F2;
    --teal-tint:#EFF8F7;
    --white:#F5F7F7;
    --paper:#FFFFFF;
    --slate:#8A97A8;
    --slate-300:#C6CEDA;
    --slate-100:#E9EDF2;
    --ink:#182430;
    --ink-soft:#54627A;
    --amber:#C9822E;
    --amber-tint:#FBF1E3;
    --danger:#B4472C;
    --font-display:'Lexend', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --radius-lg:16px;
    --radius-md:10px;
    --radius-sm:7px;
    --shadow-card:0 1px 2px rgba(23,30,39,0.06), 0 6px 20px rgba(23,30,39,0.05);
    --shadow-hover:0 4px 10px rgba(23,30,39,0.08), 0 14px 30px rgba(14,139,139,0.12);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--white);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--charcoal);}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  .mono{font-family:var(--font-mono);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ===== Shell ===== */
  .app-shell{max-width:1180px; margin:0 auto; padding:0 28px 80px;}

  /* Top bar */
  .topbar{
    background:var(--charcoal);
    color:var(--white);
    padding:22px 28px;
    display:flex; align-items:center; justify-content:space-between;
    gap:20px;
  }
  .topbar-inner{max-width:1180px; margin:0 auto; width:100%; display:flex; align-items:center; justify-content:space-between; gap:20px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:38px; height:38px; border-radius:9px;
    background:linear-gradient(155deg, var(--teal) 0%, var(--teal-dark) 100%);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:20px; height:20px;}
  .brand-text{line-height:1.15;}
  .brand-text .name{font-family:var(--font-display); font-weight:800; font-size:17px; letter-spacing:0.5px; color:var(--white);}
  .brand-text .tag{font-size:11px; color:#AEB9C8; letter-spacing:1.2px; text-transform:uppercase;}
  .module-chip{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    padding:8px 14px 8px 12px; border-radius:100px;
    font-size:13px; color:#D7DEE8;
  }
  .module-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--teal); box-shadow:0 0 0 3px rgba(14,139,139,0.25);}
  .user-pill{font-size:12.5px; color:#9FACBE; text-align:right; line-height:1.4;}
  .user-pill strong{color:#E7ECF2; font-weight:600;}

  /* Stepper / breadcrumb — echoes the flow diagram's node+arrow language */
  .stepper-wrap{background:var(--charcoal-800); border-bottom:1px solid rgba(255,255,255,0.06);}
  .stepper{
    max-width:1180px; margin:0 auto; padding:14px 28px;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  }
  .crumb{
    display:flex; align-items:center; gap:6px;
    padding:7px 14px; border-radius:100px;
    font-size:13px; font-weight:600; font-family:var(--font-body);
    border:1px solid transparent;
    white-space:nowrap;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .crumb.active{background:var(--teal); color:#EFFBFA;}
  .crumb.done{background:rgba(14,139,139,0.14); color:var(--teal-light); border-color:rgba(14,139,139,0.35); cursor:pointer;}
  .crumb.done:hover{background:rgba(14,139,139,0.24);}
  .crumb.pending{background:transparent; color:#5C6A7E; border:1px dashed rgba(255,255,255,0.14);}
  .crumb-arrow{color:#4B5768; font-size:13px; margin:0 1px;}

  /* Main content transition */
  .view{animation:fadeSlide .28s ease;}
  @keyframes fadeSlide{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .page-head{padding:34px 0 22px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .page-head h1{font-size:26px; font-weight:700;}
  .page-head .eyebrow{font-size:12px; letter-spacing:1.4px; text-transform:uppercase; color:var(--teal-dark); font-weight:700; margin-bottom:6px;}
  .page-head .sub{color:var(--ink-soft); font-size:14.5px; margin-top:6px;}

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:600;
    border:1px solid transparent; transition:transform .1s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:var(--teal-dark); box-shadow:var(--shadow-hover);}
  .btn-ghost{background:var(--paper); color:var(--charcoal); border-color:var(--slate-300);}
  .btn-ghost:hover{border-color:var(--teal); color:var(--teal-dark);}
  .btn-back{background:transparent; color:var(--ink-soft); padding:8px 4px; font-size:13.5px;}
  .btn-back:hover{color:var(--charcoal);}
  .btn svg{width:15px; height:15px;}

  /* ===== Project grid (Select project) ===== */
  .project-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:16px;}
  @media (max-width:760px){.project-grid{grid-template-columns:1fr;}}
  .project-card{
    background:var(--paper); border:1px solid var(--slate-100); border-radius:var(--radius-lg);
    padding:22px; cursor:pointer; box-shadow:var(--shadow-card);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex; flex-direction:column; gap:14px;
  }
  .project-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-hover); border-color:rgba(14,139,139,0.35);}
  .project-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .project-card h3{font-size:17px;}
  .project-card .loc{color:var(--ink-soft); font-size:13px; margin-top:4px;}
  .status-badge{font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:4px 10px; border-radius:100px; white-space:nowrap;}
  .status-active{background:var(--teal-tint); color:var(--teal-dark);}
  .status-completed{background:var(--slate-100); color:var(--ink-soft);}
  .type-tag{font-size:11.5px; color:var(--ink-soft); background:var(--slate-100); padding:3px 9px; border-radius:6px; display:inline-block; width:fit-content;}
  .progress-row{display:flex; flex-direction:column; gap:6px;}
  .progress-labels{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft);}
  .progress-labels b{color:var(--charcoal); font-family:var(--font-mono); font-weight:600;}
  .progress-track{height:6px; background:var(--slate-100); border-radius:100px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--teal), var(--teal-dark)); border-radius:100px;}
  .progress-fill.over{background:linear-gradient(90deg, var(--amber), var(--danger));}
  .project-card-foot{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--slate); border-top:1px dashed var(--slate-100); padding-top:12px;}

  /* ===== Overview ===== */
  .section-title{font-size:13px; text-transform:uppercase; letter-spacing:.8px; color:var(--ink-soft); font-weight:700; margin:8px 0 14px;}

  /* ===== P&L statement (Overview) ===== */
  .pl-sheet{background:#fff; border:1px solid var(--slate-100); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:30px 34px 22px; max-width:720px;}
  .pl-masthead{display:flex; justify-content:space-between; align-items:flex-start;}
  .pl-stamp{font-size:10.5px; color:var(--slate); line-height:1.5; width:64px;}
  .pl-stamp span{font-style:italic;}
  .pl-title{text-align:center; flex:1;}
  .pl-company{font-family:var(--font-display); font-weight:800; font-size:14.5px; color:var(--charcoal); letter-spacing:.5px;}
  .pl-report-name{font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--charcoal); margin-top:3px;}
  .pl-report-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .pl-period-row{display:flex; justify-content:space-between; border-bottom:2px solid var(--charcoal); padding:12px 0 6px; margin-top:14px; font-size:12px; font-weight:700; color:var(--charcoal);}
  .pl-period-row span:last-child{font-family:var(--font-mono); min-width:130px; text-align:right;}
  .pl-body{margin-top:4px;}
  .pl-row{display:flex; justify-content:space-between; align-items:baseline; padding:3px 0; font-size:13px; color:var(--ink); gap:14px;}
  .pl-row.lvl0{padding-left:0; font-weight:600;}
  .pl-row.lvl1{padding-left:18px;}
  .pl-row.lvl2{padding-left:36px;}
  .pl-row.lvl3{padding-left:54px; color:var(--ink-soft); font-size:12.5px;}
  .pl-row.pl-section-label{font-weight:700; color:var(--charcoal); padding-top:10px;}
  .pl-label{flex:1;}
  .pl-amount{font-family:var(--font-mono); min-width:100px; text-align:right; flex-shrink:0;}
  .pl-row.subtotal{font-weight:700; margin-top:1px;}
  .pl-row.subtotal .pl-amount{border-top:1px solid var(--slate-300); padding-top:3px;}
  .pl-row.grandtotal{font-weight:800; margin-top:8px; font-size:14px;}
  .pl-row.grandtotal .pl-amount{border-top:3px double var(--charcoal); padding-top:4px;}
  .pl-row.group-label{font-weight:700; color:var(--charcoal); padding-top:12px;}
  .pl-row.clickable{cursor:pointer; border-radius:6px;}
  .pl-row.clickable:hover{background:var(--teal-tint);}
  .pl-hint{margin-top:18px; font-size:11.5px; color:var(--slate); text-align:center; font-style:italic;}

  .meta-strip{display:flex; gap:26px; flex-wrap:wrap; margin-bottom:20px; padding:14px 18px; background:var(--paper); border:1px solid var(--slate-100); border-radius:var(--radius-md); box-shadow:var(--shadow-card);}
  .meta-strip .ms-item .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--slate); font-weight:600;}
  .meta-strip .ms-item .v{font-size:13px; color:var(--ink); margin-top:3px; font-weight:500;}

  /* ===== Table (transactions) ===== */
  .table-wrap{background:var(--paper); border:1px solid var(--slate-100); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); overflow:hidden;}
  table{width:100%; border-collapse:collapse;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--slate); font-weight:700; padding:14px 18px; border-bottom:1px solid var(--slate-100);
    background:#FAFBFC;
  }
  tbody td{padding:14px 18px; font-size:13.5px; border-bottom:1px solid var(--slate-100); color:var(--ink);}
  tbody tr{cursor:pointer; transition:background .12s ease;}
  tbody tr:hover{background:var(--teal-tint);}
  tbody tr:last-child td{border-bottom:none;}
  .cell-amount{font-family:var(--font-mono); font-weight:600; text-align:right;}
  .cell-id{font-family:var(--font-mono); font-size:12px; color:var(--slate);}
  .status-pill{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:100px; text-transform:uppercase; letter-spacing:.3px;}
  .pill-received, .pill-active, .pill-delivered{background:var(--teal-tint); color:var(--teal-dark);}
  .pill-ordered{background:var(--amber-tint); color:var(--amber);}
  .pill-returned, .pill-completed{background:var(--slate-100); color:var(--ink-soft);}
  .chev{color:var(--slate-300); font-size:16px;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;}

  .filter-chip{display:inline-flex; align-items:center; gap:10px; background:var(--teal-tint); color:var(--teal-dark); border:1px solid rgba(14,139,139,0.3); border-radius:100px; padding:7px 8px 7px 16px; font-size:13px; margin-bottom:16px;}
  .filter-chip strong{font-weight:700;}
  .filter-chip button{background:rgba(14,139,139,0.15); border:none; color:var(--teal-dark); width:20px; height:20px; border-radius:50%; font-size:11px; line-height:1;}
  .filter-chip button:hover{background:rgba(14,139,139,0.28);}

  /* ===== Detail / voucher ===== */
  .voucher{background:var(--paper); border:1px solid var(--slate-100); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); overflow:hidden; max-width:680px;}
  .voucher-head{background:var(--charcoal); color:#fff; padding:24px 28px; display:flex; justify-content:space-between; align-items:flex-start;}
  .voucher-head .vh-title{font-family:var(--font-display); font-weight:700; font-size:15px;}
  .voucher-head .vh-sub{font-size:12px; color:#AEB9C8; margin-top:4px;}
  .voucher-head .vh-id{font-family:var(--font-mono); font-size:13px; color:var(--teal-light); text-align:right;}
  .voucher-body{padding:26px 28px;}
  .v-amount-block{text-align:center; padding:10px 0 24px; border-bottom:1px dashed var(--slate-100); margin-bottom:22px;}
  .v-amount-block .amt-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--slate); font-weight:600;}
  .v-amount-block .amt{font-family:var(--font-mono); font-size:36px; font-weight:700; color:var(--charcoal); margin-top:6px;}
  .v-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px 24px;}
  .v-item .k{font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--slate); font-weight:600;}
  .v-item .v{font-size:14px; margin-top:5px; color:var(--ink); font-weight:500;}
  .v-item.full{grid-column:1 / -1;}
  .v-note{background:#FAFBFC; border:1px solid var(--slate-100); border-radius:var(--radius-sm); padding:14px 16px; font-size:13px; color:var(--ink-soft); margin-top:22px; line-height:1.5;}
  .sign-row{display:flex; justify-content:space-between; margin-top:34px; gap:20px;}
  .sign-box{flex:1; border-top:1px solid var(--slate-300); padding-top:8px; font-size:11.5px; color:var(--slate);}

  /* ===== Print sheet (hidden on screen, shown in print) ===== */
  .print-sheet{display:none;}
  .print-letterhead{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:3px solid var(--charcoal); padding-bottom:14px; margin-bottom:22px;}
  .print-letterhead .pl-brand{font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--charcoal); letter-spacing:.4px;}
  .print-letterhead .pl-tag{font-size:11px; color:var(--teal-dark); letter-spacing:1px; text-transform:uppercase; margin-top:2px;}
  .print-letterhead .pl-meta{text-align:right; font-size:11.5px; color:var(--ink-soft); line-height:1.5;}
  .print-footer{margin-top:36px; padding-top:12px; border-top:1px solid var(--slate-300); font-size:10.5px; color:var(--slate); display:flex; justify-content:space-between;}

  @media print{
    .no-print{display:none !important;}
    .print-sheet{display:block !important; width:100%; padding:0 6mm;}
  }

  .footer-note{text-align:center; padding:50px 0 10px; color:var(--slate); font-size:12px; font-style:italic;}

  .empty-hint{color:var(--ink-soft); font-size:13px; padding:30px; text-align:center;}
</style>
</head>

const APPROVERS = {
  'hodan-towers':'Eng. Cabdiraxmaan Warsame', 'kaah-residence':'Eng. Faadumo Cali',
  'guriga-cusub':'Eng. Xasan Maxamed', 'bosaso-warehouse':'Eng. Zamzam Nuur',
};
const ENTERERS = ['Amiin Xasan','Sagal Warsame','Cabdiweli Nuur','Farxiya Cali'];

function buildTxns(){
  const catPrefix = {manpower:'MP', materials:'MT', equipment:'EQ'};
  let counter = 1000;
  const out = {};
  Object.keys(RAW).forEach(pid=>{
    out[pid] = {manpower:[], materials:[], equipment:[]};
    Object.keys(RAW[pid]).forEach(cat=>{
      RAW[pid][cat].forEach((row, idx)=>{
        counter++;
        const id = `TXN-${catPrefix[cat]}-${counter}`;
        const enteredBy = ENTERERS[(counter) % ENTERERS.length];
        const paymentMethod = PAYMENT_METHODS[(counter) % PAYMENT_METHODS.length];
        out[pid][cat].push({ id, ...row, enteredBy, approvedBy:APPROVERS[pid], paymentMethod });
      });
    });
  });
  return out;
}
const TXNS = buildTxns();

/* ================= CHART OF ACCOUNTS (for the P&L statement) ================= */
const MANPOWER_CODES = { Food:'50101', Transport:'50102', Tools:'50103', Accommodation:'50104', Safety:'50105', Medical:'50106' };

function buildItemCodeMap(cat, startCode){
  const map = {}; let next = startCode;
  Object.keys(TXNS).forEach(pid=>{
    TXNS[pid][cat].forEach(r=>{
      if(!(r.item in map)){ map[r.item] = String(next); next += 1; }
    });
  });
  return map;
}
const MATERIAL_CODES = buildItemCodeMap('materials', 50201);
const EQUIPMENT_CODES = buildItemCodeMap('equipment', 50301);

// Period income recognised against each project's logged costs (for the demo period shown)
const INCOME = { 'hodan-towers':14750, 'kaah-residence':5850, 'guriga-cusub':19200, 'bosaso-warehouse':12100 };

function incomeMeta(type){
  if(type==='Construction') return {code:'40100', label:'Construction Income'};
  if(type==='Real Estate') return {code:'40200', label:'Rental & Sales Income'};
  return {code:'40300', label:'Material Sales Income'};
}

function periodRange(pid){
  const dates = [];
  ['manpower','materials','equipment'].forEach(cat=> TXNS[pid][cat].forEach(r=> dates.push(r.date)));
  dates.sort();
  return { from: dates[0], to: dates[dates.length-1] };
}

function buildPL(pid){
  const inc = incomeMeta(PROJECTS.find(x=>x.id===pid).type);
  const incomeAmount = INCOME[pid];

  const mpRollup = {};
  TXNS[pid].manpower.forEach(r=>{ mpRollup[r.sub] = (mpRollup[r.sub]||0) + r.amount; });
  const mpLines = Object.keys(mpRollup)
    .sort((a,b)=> (MANPOWER_CODES[a]||'50199').localeCompare(MANPOWER_CODES[b]||'50199'))
    .map(sub=> ({ code: MANPOWER_CODES[sub] || '501xx', label: sub, amount: mpRollup[sub] }));

  const matLines = TXNS[pid].materials.map(r=> ({ code: MATERIAL_CODES[r.item], label: r.item, amount: r.total, txnId: r.id }));
  const eqLines = TXNS[pid].equipment.map(r=> ({ code: EQUIPMENT_CODES[r.item], label: r.item, amount: r.total, txnId: r.id }));

  const sections = [
    { code:'50100', label:'Manpower', cat:'manpower', lines: mpLines, total: catSum(pid,'manpower') },
    { code:'50200', label:'Materials', cat:'materials', lines: matLines, total: catSum(pid,'materials') },
    { code:'50300', label:'Equipment', cat:'equipment', lines: eqLines, total: catSum(pid,'equipment') },
  ];
  const totalExpense = sections.reduce((s,sec)=> s+sec.total, 0);
  const netIncome = incomeAmount - totalExpense;

  return { income:inc, incomeAmount, sections, totalExpense, netIncome, period: periodRange(pid) };
}

/* ================= HELPERS ================= */
function money(n){
  return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
}
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}
function catSum(pid, cat){
  return TXNS[pid][cat].reduce((s,r)=> s + (r.total ?? r.amount), 0);
}
function catCount(pid, cat){ return TXNS[pid][cat].length; }
function statusClass(status){
  const s = status.toLowerCase();
  if(['received','active','delivered'].includes(s)) return 'pill-received';
  if(s === 'ordered') return 'pill-ordered';
  return 'pill-returned';
}

/* ================= STEPPER ================= */
function renderStepper(){
  const p = state.projectId ? PROJECTS.find(x=>x.id===state.projectId) : null;
  const crumbs = [];
  crumbs.push({ label:'Reports', state:'reachable', onClick:()=>go('home',{projectId:null, category:null, txnId:null, filterSub:null}) });

  if(p){
    crumbs.push({ label:p.name, state: state.view==='home' ? 'pending' : 'reachable', onClick:()=>go('overview',{projectId:p.id, category:null, txnId:null, filterSub:null}) });
    crumbs.push({ label:'Overview', state: state.view==='overview' ? 'active' : (['category','detail'].includes(state.view) ? 'done' : 'pending'), onClick:()=> state.view!=='home' ? go('overview',{projectId:p.id, category:null, txnId:null, filterSub:null}) : null });
  } else {
    crumbs.push({ label:'Select project', state: state.view==='home' ? 'active' : 'pending' });
    crumbs.push({ label:'Overview', state:'pending' });
  }

  if(state.category){
    crumbs.push({ label:CATEGORY_META[state.category].label, state: state.view==='category' ? 'active' : (state.view==='detail' ? 'done' : 'pending'), onClick:()=>go('category',{category:state.category, txnId:null, filterSub:null}) });
  } else {
    crumbs.push({ label:'Select item', state:'pending' });
  }

  if(state.txnId){
    crumbs.push({ label:'Full details', state:'active' });
  } else {
    crumbs.push({ label:'Full details', state:'pending' });
  }

  const html = crumbs.map((c,i)=>{
    const cls = c.state === 'active' ? 'active' : (c.state === 'done' || c.state === 'reachable' ? 'done' : 'pending');
    const clickable = (cls === 'done') && c.onClick;
    return `${i>0 ? '<span class="crumb-arrow">›</span>' : ''}<span class="crumb ${cls}" data-idx="${i}">${c.label}</span>`;
  }).join('');
  const stepperEl = document.getElementById('stepper');
  stepperEl.innerHTML = html;

  // attach click handlers to reachable/done crumbs
  Array.from(stepperEl.querySelectorAll('.crumb')).forEach((el, i)=>{
    const c = crumbs[i];
    if(c.onClick && el.classList.contains('done')){
      el.style.cursor = 'pointer';
      el.addEventListener('click', c.onClick);
    }
  });
}

            <div class="v-item"><div class="k">Status</div><div class="v">${r.status}</div></div>
          `}
          <div class="v-item"><div class="k">Payment method</div><div class="v">${r.paymentMethod}</div></div>
          <div class="v-item"><div class="k">Entered by</div><div class="v">${r.enteredBy}</div></div>
          <div class="v-item"><div class="k">Approved by</div><div class="v">${r.approvedBy}</div></div>
        </div>
        <div class="v-note">Xogtan waxay ka socotaa diiwaanka <strong>${meta.label}</strong> ee mashruuca <strong>${p.name}</strong>. Print-ka waxa uu u shaqeeyaa sida rasiid rasmi ah.</div>
        <div class="sign-row">
          <div class="sign-box">Prepared by — ${r.enteredBy}</div>
          <div class="sign-box">Approved by — ${r.approvedBy}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function printCurrent(){ window.print(); }

/* ================= RENDER DISPATCH ================= */
function render(){
  const app = document.getElementById('app');
  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'overview') app.innerHTML = renderOverview();
  else if(state.view === 'category') app.innerHTML = renderCategory();
  else if(state.view === 'detail') app.innerHTML = renderDetail();
  renderStepper();
}

render();
</script>
</body>
</html>
